    description: >-
      Interfaces para sistemas complexos — fiscal, financeiro e logístico — onde a
      densidade de informação é alta e o erro custa dinheiro ao usuário.
  - title: Design Systems
    description: >-
      Bibliotecas de componentes versionadas, documentadas e consumidas por vários
      produtos, com contratos de API estáveis e ciclo de release automatizado.
  - title: Performance & Core Web Vitals
    description: >-
      Diagnóstico e correção de gargalos reais: bundle, renderização, cache e pipeline
      de build. Menos JavaScript, mais percepção de velocidade.
  - title: Qualidade & DX
    description: >-
      Testes automatizados, padrões de código acordados com o time, code review e
      pipelines de CI/CD que encurtam o caminho entre o commit e a produção.
  - title: Arquitetura & Back-end
    description: >-
      Também atuo diretamente em back-end e automação — APIs, integração de dados e
      observabilidade — unindo a visão de produto que trago do front-end a decisões de
      infraestrutura e escalabilidade.

