summary: >-
  Desenvolvedor de sistemas na Sicredi Aliança, cooperativa de crédito ligada ao Sicredi.
  Atuo na área de desenvolvimento construindo APIs e automatizando rotinas — via API ou
  RPA — para reduzir trabalho manual dos setores da sede.

responsibilities:
  - Desenvolvimento de APIs com Python e FastAPI para integração entre sistemas internos.
  - Automação de rotinas operacionais via API e RPA (Playwright) para eliminar trabalho manual de setores da sede.
  - Construção de pipelines de dados e orquestração de jobs com Prefect e CronJob.
  - Integração e consulta a dados corporativos via Databricks e Denodo, com persistência em PostgreSQL, além de geração de bases para automações e BI.
  - Observabilidade de sistemas e automações com Grafana.
  - Arquitetura de soluções em microsserviços, com gestão de ambientes Python via UV.
  - Desenvolvimento de microsserviços, APIs e automações RPA também em TypeScript e DevConsole.
  - Evolução tecnológica da área, introduzindo padrões como DDD, Onion Architecture, SOLID e boas práticas de desenvolvimento.
  - Estruturação do uso de Git e CI/CD, incluindo migração de Git Submodules para Monorepo.
  - Implementação do HashiCorp Vault para gerenciamento seguro de credenciais e criação de um serviço centralizado de autenticação.
  - Criação de dashboards no Grafana para monitoramento das execuções e erros das automações.

