credential: Postgraduate degree in DevOps and Cloud Architecture (Pós Tech)

description: >-
  360-hour, 10-month FIAP+Alura program, fully online and hands-on, using
  Project Based Learning: each phase solves a real market problem through a
  practical project. Expected completion in May 2027.

highlights:
  - Five-phase PBL track, from DevOps culture and cloud architecture to multicloud, SRE and FinOps.
  - Containerization and orchestration with Docker and Kubernetes, infrastructure as code and CI/CD pipelines.
  - DevSecOps, observability (monitoring, logging, APM) and incident-response automation.
